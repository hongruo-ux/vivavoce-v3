<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us — Viva Voce</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="header-additions.css" />
  <link rel="stylesheet" href="editorial-addition.css" />
  <link rel="stylesheet" href="article-addition.css" />
  <link rel="stylesheet" href="plp-additions.css" />
  <link rel="stylesheet" href="cart-additions.css">
  <link rel="stylesheet" href="carousel.css">
  <link rel="stylesheet" href="contact-addition.css">
  <link rel="stylesheet" href="login-addition.css">
</head>
<body class="bg-article">

  <div id="main-header"></div>

  <main>

    <!-- ═══════════════════════════════════════════════
         1. BREADCRUMB
    ════════════════════════════════════════════════ -->
    <div class="container" >
      <div class="breadcrumb">
        <a href="index.html">Home</a><span>/</span>
        <span>Contact Us</span>
      </div>
    </div>

  


    <!-- ═══════════════════════════════════════════════
         2. PAGE HEADER — image left, text right
    ════════════════════════════════════════════════ -->
    <section class="contact-header-grid">
    <div class="form-page-header-left contact">
      <div class="wf-img ratio-1-1" style="background-image: url('images/ambassadors/Frame\ 6.png');"></div>
    </div>
    <div class="contact-header-right contact">
      <h1 class="article-title-main contact">CONTACT US</h1>
      <p class="article-body-text">Need to get in touch? Feel free to reach out using the contact form or email us directly.</p>
      <p>We're available to Monday - Friday 9a.m - 5pm EST</p>
  
    </div>
  </section>



    <!-- ═══════════════════════════════════════════════
         3. CONTACT FORM — single col
    ════════════════════════════════════════════════ -->
    <section class="article-body-section">
      <div class="article-content-wrap contact-wrap section-sm">
        <div class="editorial-hero-content form-title-section">
          <h2 class="article-section-title">How can we help you?</h2>
          <p class="article-body-text form-summary">Feel free to send us a message — our team will get in touch with you within 3 business days.</p>
        
        </div>
        
        <div class="contact-form-wrap">
          <div>
            <label class="input-label" for="contact-name">Your Full Name</label>
            <input type="text" id="contact-name" name="name" placeholder="What's your first and last name?" autocomplete="name" />
          </div>
          <div>
            <label class="input-label" for="contact-email">Your Email</label>
            <input type="email" id="contact-email" name="email" placeholder="What's your email?" autocomplete="email" />
          </div>
          <div>
            <label class="input-label" for="contact-message">Message</label>
            <textarea id="contact-message" name="message" placeholder="Message" rows="6"></textarea>
          </div>
          <label class="radio-option auth-checkbox-row">
              <input type="checkbox" id="signin-remember" name="remember" class="auth-checkbox" />
             Sign up for our newsletter
            </label>
          <button class="btn filled full lg" type="submit">Send</button>
          
        </div>

      </div>
    </section>

  </main>

  <div id="main-footer"></div>

  <script src="header.js"></script>
  <script src="footer.js"></script>

</body>
</html>
