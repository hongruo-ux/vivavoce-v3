<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>password — Page Not Found — Viva Voce</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="header-additions.css" />
  <link rel="stylesheet" href="carousel.css">
  <link rel="stylesheet" href="contact-addition.css">

  <style>
    /* password Page Styles */
    .error-password-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 1.5rem;
    }

    .error-password-copy {
      color: var(--text-secondary);
      max-width: 800px;
      line-height: 1.6;
      margin: 0;
    }

    .error-password-cta {
      margin-top: 1rem;
    }

    /* Category cards grid - desktop 4 columns, mobile carousel */
    .category-cards-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: .5rem;
    }
    .logo-container-password {
        display: flex;
        align-items: center;
        justify-content: center;
        padding-bottom: 1rem;
      }

      .logo-img-password {
        width: auto;
        height: 40px;
        display: block;
      }



    /* Hide grid on mobile, show carousel instead */
    @media (max-width: 1079px) {
      .category-cards-grid {
        display: none;
      }
    }

    /* Show carousel only on mobile */
    .category-cards-carousel {
      display: none;
    }

    @media (max-width: 1079px) {
      .category-cards-carousel {
        display: block;
      }

      .error-password-section {
        padding: 1rem 1.5rem;
        gap: 1rem;
      }

  
    }

    @media (max-width: 739px) {
   

      .error-password-section {
        padding: 2.5rem 1rem;
        gap: 1rem;
      }
    }

   
  </style>
</head>

<body>


  <main>

 

    <!-- password SECTION -->
    <div class="band" style="display: flex;  align-items: center;  justify-content: center;  min-height: 100vh;">
      <div class="container">
        <div class="section-lg">
          <div class="error-password-section">
            <!-- <div class="logo-container-password">
             <img class="logo-img-password" src="images/logo/logo-black.png" alt="Viva Voce Logo" />

            </div> -->
            <h1 class="">Opening Soon</h1>
            <p class="error-password-copy">Sign up for our newsletter to be the first to know when we launch.</p>
            <section class="article-body-section" style="width: 100%;">
              <div class="article-content-wrap contact-wrap ">
                <div class="contact-form-wrap">
                  <div>
                    <input type="text" id="code-input" name="code" placeholder="Enter your code" autocomplete="off" />
                  </div>
                  <button class="btn filled full lg" type="submit">Submit</button>
                </div>
              </div>
            </section>
        </div>
      </div>
    </div>


  </main>


  <script src="carousel-stepper.js"></script>
  <script src="carousel.js"></script>

</body>
</html>
